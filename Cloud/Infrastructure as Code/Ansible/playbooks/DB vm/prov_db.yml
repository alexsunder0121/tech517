---
# Playbook to install and configure MongoDB on the database server
- name: Configure MongoDB database

  # Target the database host group defined in the inventory
  hosts: db

  # Run tasks with elevated (root) privileges
  become: true

  tasks:

    # Install base packages required to add external repositories securely
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - gnupg   # Used to verify and manage GPG keys
          - curl    # Used to download MongoDB signing key
        state: present
        update_cache: yes

    # Download and install the MongoDB GPG signing key
    # This allows apt to trust packages from the MongoDB repository
    - name: Add MongoDB GPG key
      ansible.builtin.shell: |
        curl -fsSL https://pgp.mongodb.com/server-7.0.asc |
        gpg --dearmor -o /usr/share/keyrings/mongodb-server-7.0.gpg
      args:
        # Prevents re-downloading the key if it already exists
        creates: /usr/share/keyrings/mongodb-server-7.0.gpg

    # Add the official MongoDB repository to the system
    # This tells apt where to download MongoDB packages from
    - name: Add MongoDB repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/mongodb-org-7.0.list
        content: |
          deb [ arch=amd64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] \
          https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse

    # Install MongoDB from the newly added repository
    - name: Install MongoDB
      ansible.builtin.apt:
        name: mongodb-org
        state: present
        update_cache: yes

    # Update MongoDB configuration so it listens on all network interfaces
    # This allows the app server to connect to the database remotely
    - name: Configure MongoDB to listen on all interfaces
      ansible.builtin.lineinfile:
        path: /etc/mongod.conf
        regexp: '^\\s*bindIp:'
        line: '  bindIp: 0.0.0.0'

    # Restart MongoDB to apply the configuration change
    # Enable ensures MongoDB starts automatically on boot
    - name: Enable and restart MongoDB
      ansible.builtin.systemd:
        name: mongod
        state: restarted
        enabled: true