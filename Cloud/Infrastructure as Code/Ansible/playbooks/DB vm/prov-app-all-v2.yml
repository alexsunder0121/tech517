---
# PLAY 1: Configure MongoDB #

# This play provisions and configures MongoDB on the database VM
- name: Configure MongoDB database

  # Target only hosts in the "db" inventory group
  hosts: db

  # Run all tasks as root (required for system configuration)
  become: true

  tasks:

    # Install system packages required to add external repositories securely
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - gnupg        # Used to verify MongoDB GPG keys
          - curl         # Used to download MongoDB GPG key
        state: present
        update_cache: yes

    # Download MongoDB's official GPG signing key and convert it
    # This allows apt to trust MongoDB packages
    - name: Add MongoDB GPG key
      ansible.builtin.shell: |
        curl -fsSL https://pgp.mongodb.com/server-7.0.asc |
        gpg --dearmor -o /usr/share/keyrings/mongodb-server-7.0.gpg
      args:
        # Prevents re-downloading the key on re-runs
        creates: /usr/share/keyrings/mongodb-server-7.0.gpg

    # Add MongoDB's official repository for Ubuntu 22.04 (Jammy)
    - name: Add MongoDB repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/mongodb-org-7.0.list
        content: |
          deb [ arch=amd64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] \
          https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse

    # Install MongoDB from the newly added repository
    - name: Install MongoDB
      ansible.builtin.apt:
        name: mongodb-org
        state: present
        update_cache: yes

    # Modify MongoDB config so it listens on all network interfaces
    # Required so the app VM can connect to the database
    - name: Configure MongoDB bind IP
      ansible.builtin.lineinfile:
        path: /etc/mongod.conf
        regexp: '^\s*bindIp:'
        line: '  bindIp: 0.0.0.0'

    # Restart MongoDB to apply config changes
    # Enable ensures MongoDB starts automatically on boot
    - name: Restart and enable MongoDB
      ansible.builtin.systemd:
        name: mongod
        state: restarted
        enabled: true

    # Validation step: check MongoDB is actually listening on port 27017
    - name: Check MongoDB is listening on port 27017
      ansible.builtin.shell: ss -lntp | grep 27017 || true
      register: mongo_listen_check
      changed_when: false


# PLAY 2: Configure Application #

# This play provisions and starts the Node.js application
- name: Configure Node app and connect to DB

  # Target only hosts in the "web" inventory group
  hosts: web

  # Run system-level tasks as root
  become: true

  # Variables used throughout the play
  vars:
    app_path: /home/ubuntu/app        # Location of app on target VM
    app_name: sparta-app              # PM2 process name

    # MongoDB connection string (hardcoded DB private IP)
    db_host: "mongodb://172.31.46.210:27017/posts"

  tasks:

    # Install required system packages for the app and reverse proxy
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - nginx     # Reverse proxy (port 80 → 3000)
          - git       # Used for code management
          - curl      # Required for NodeSource installer
        state: present
        update_cache: yes

    # Add NodeSource repository so we can install Node.js 18
    - name: Add NodeSource Node.js repo
      ansible.builtin.shell: curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
      args:
        # Prevents running the script again on re-runs
        creates: /etc/apt/sources.list.d/nodesource.list

    # Install Node.js
    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present

    # Install PM2 globally to manage the Node.js process
    - name: Install PM2 globally
      ansible.builtin.npm:
        name: pm2
        global: yes

    # Copy the application code from the controller VM to the app VM
    - name: Copy app from controller to target
      ansible.builtin.copy:
        src: /home/ubuntu/tech517-sparta-app/app/
        dest: "{{ app_path }}/"
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    # Install Node.js dependencies defined in package.json
    # Run as ubuntu user to avoid permission issues
    - name: Install app dependencies
      ansible.builtin.npm:
        path: "{{ app_path }}"
      become_user: ubuntu

    # Wait until MongoDB is reachable before continuing
    # Prevents race condition where app starts before DB is ready
    - name: Wait for MongoDB to be reachable from app node
      ansible.builtin.wait_for:
        host: "172.31.46.210"
        port: 27017
        timeout: 60

    # Check for a marker file to avoid reseeding the database
    - name: Check if database has already been seeded
      ansible.builtin.stat:
        path: /home/ubuntu/.db_seeded
      register: seed_marker

    # Seed the database only on first run
    - name: Seed database (first run only)
      ansible.builtin.shell: |
        export DB_HOST="{{ db_host }}"
        node seeds/seed.js
        touch /home/ubuntu/.db_seeded
      args:
        chdir: "{{ app_path }}"
      become_user: ubuntu
      when: not seed_marker.stat.exists

    # Configure nginx to forward HTTP traffic to the Node app on port 3000
    - name: Configure nginx reverse proxy
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/default
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;

              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
              }
          }

    # Validate nginx configuration before restarting
    - name: Test nginx config
      ansible.builtin.command: nginx -t
      changed_when: false

    # Restart nginx and ensure it starts on boot
    - name: Restart nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
        enabled: true

    # Stop the app if it is already running
    # Allows safe re-runs of the playbook
    - name: Stop existing app (safe re-run)
      ansible.builtin.shell: pm2 delete {{ app_name }} || true
      become_user: ubuntu

    # Start the Node app in the background using PM2
    # DB_HOST is injected so the app connects to MongoDB
    - name: Start app with PM2 using DB_HOST
      ansible.builtin.shell: |
        export DB_HOST="{{ db_host }}"
        pm2 start npm --name {{ app_name }} -- start
        pm2 save
      args:
        chdir: "{{ app_path }}"
      become_user: ubuntu