---
- name: Update and upgrade packages on web and db servers (safe)
  hosts: web,db
  become: true
  gather_facts: true
  serial: 1

  tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.shell: cloud-init status --wait
      changed_when: false

    - name: Wait until apt lock is free (up to 10 minutes)
      ansible.builtin.shell: |
        while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          echo "apt lock held, waiting..."
          sleep 10
        done
      changed_when: false

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages (dist-upgrade)
      ansible.builtin.apt:
        upgrade: dist

    - name: Remove unused packages
      ansible.builtin.apt:
        autoremove: yes