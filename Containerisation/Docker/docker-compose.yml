services:
  mongo:
    image: mongo:7.0
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    image: sunder09/sparta-test-app:latest
    container_name: app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mongodb://mongo:27017/posts
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data: